<svg xmlns="http://www.w3.org/2000/svg" width="940" height="272" viewBox="0 0 940 272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="940" height="272" fill="#ffffff"/>
  <rect x="22" y="74" width="168" height="132" rx="12" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/>
  <text x="38" y="104" font-size="14.5" font-weight="650" fill="#1f2328">数据层</text>
  <text x="38" y="130" font-size="11.5" fill="#57606a">· FinCUGE 三任务</text>
  <text x="38" y="152" font-size="11.5" fill="#57606a">· 新闻 15 类 → 7 类</text>
  <text x="38" y="174" font-size="11.5" fill="#57606a">· 序列按 P99 定</text>
  <text x="38" y="193" font-size="11.5" font-weight="600" fill="#8c959f">1.6 万条</text>
  <line x1="194" y1="140.0" x2="208" y2="140.0" stroke="#c9ced6" stroke-width="1.4"/>
  <path d="M208,140.0 l-5,-3.4 v6.8 z" fill="#c9ced6"/>
  <rect x="212" y="74" width="168" height="132" rx="12" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/>
  <text x="228" y="104" font-size="14.5" font-weight="650" fill="#1f2328">训练层</text>
  <text x="228" y="130" font-size="11.5" fill="#57606a">· LoRA 0.84% 参数</text>
  <text x="228" y="152" font-size="11.5" fill="#57606a">· 只对答案算 loss</text>
  <text x="228" y="174" font-size="11.5" fill="#57606a">· 梯度累积 + 检查点</text>
  <text x="228" y="193" font-size="11.5" font-weight="600" fill="#8c959f">3 小时 / 任务</text>
  <line x1="384" y1="140.0" x2="398" y2="140.0" stroke="#c9ced6" stroke-width="1.4"/>
  <path d="M398,140.0 l-5,-3.4 v6.8 z" fill="#c9ced6"/>
  <rect x="402" y="74" width="168" height="132" rx="12" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/>
  <text x="418" y="104" font-size="14.5" font-weight="650" fill="#1f2328">评测层</text>
  <text x="418" y="130" font-size="11.5" fill="#57606a">· 受限 softmax</text>
  <text x="418" y="152" font-size="11.5" fill="#57606a">· 实体四口径</text>
  <text x="418" y="174" font-size="11.5" fill="#57606a">· 全量 + 置信分层</text>
  <text x="418" y="193" font-size="11.5" font-weight="600" fill="#8c959f">4 套指标</text>
  <line x1="574" y1="140.0" x2="588" y2="140.0" stroke="#c9ced6" stroke-width="1.4"/>
  <path d="M588,140.0 l-5,-3.4 v6.8 z" fill="#c9ced6"/>
  <rect x="592" y="74" width="168" height="132" rx="12" fill="#fdece3" stroke="#c2410c" stroke-width="1.6"/>
  <text x="608" y="104" font-size="14.5" font-weight="650" fill="#c2410c">外壳层</text>
  <text x="608" y="130" font-size="11.5" fill="#57606a">· 路由 → 校验</text>
  <text x="608" y="152" font-size="11.5" fill="#57606a">· 三档判定 + 投票</text>
  <text x="608" y="174" font-size="11.5" fill="#57606a">· 单行 trace</text>
  <text x="608" y="193" font-size="11.5" font-weight="600" fill="#c2410c">3 档判定</text>
  <line x1="764" y1="140.0" x2="778" y2="140.0" stroke="#c9ced6" stroke-width="1.4"/>
  <path d="M778,140.0 l-5,-3.4 v6.8 z" fill="#c9ced6"/>
  <rect x="782" y="74" width="168" height="132" rx="12" fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1"/>
  <text x="798" y="104" font-size="14.5" font-weight="650" fill="#1f2328">前端</text>
  <text x="798" y="130" font-size="11.5" fill="#57606a">· 三标签页网页</text>
  <text x="798" y="152" font-size="11.5" fill="#57606a">· 命令行交互</text>
  <text x="798" y="174" font-size="11.5" fill="#57606a">· 一键启动脚本</text>
  <text x="798" y="193" font-size="11.5" font-weight="600" fill="#8c959f">1 秒级</text>
  <text x="22" y="36" font-size="13" font-weight="600" fill="#1f2328">五层结构：数据进去，结论出来，中间每一步都可单独验证</text>
  <text x="22" y="58" font-size="11.5" fill="#8c959f">全部跑在一张 GTX 1650（4GB）上；橙色框是模型之外自建的调度与质检层</text>
  <text x="22" y="252" font-size="11" fill="#8c959f">训练与推理均离线，不依赖任何外部 API；模型权重 20MB/adapter，三个任务共 58MB。</text>
</svg>